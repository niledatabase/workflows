name: 'Save BuildKit cache mounts'
description: 'Saves each discovered BuildKit cache mount to GitHub Actions cache'

inputs:
  builder:
    description: 'Buildx builder used by the image build'
    required: true
  file:
    description: 'Path to the Dockerfile to inspect'
    required: false
    default: 'Dockerfile'
  target:
    description: 'Dockerfile target stage to inspect'
    required: false
  platforms:
    description: 'Comma- or newline-separated target platforms of the image build (default: the platform of the builder)'
    required: false
  build-args:
    description: 'Newline-separated Dockerfile build arguments (NAME=VALUE or NAME)'
    required: false
  key:
    description: 'Cache key used to restore and save each discovered mount'
    required: true
  binary-commit:
    description: 'Full commit SHA of the buildkit-cache-mounts release to download'
    required: false
    default: ''

runs:
  using: composite
  steps:
    # The binary runs in github-script, because the runner sets ACTIONS_RUNTIME_TOKEN and ACTIONS_RESULTS_URL only for JavaScript and container actions (actions/runner#3046).
    - name: Save cache mounts
      continue-on-error: true
      uses: actions/github-script@v9
      env:
        GH_TOKEN: ${{ github.token }}
        BINARY_COMMIT: ${{ inputs.binary-commit }}
        BUILDER: ${{ inputs.builder }}
        FILE: ${{ inputs.file }}
        TARGET: ${{ inputs.target }}
        PLATFORMS: ${{ inputs.platforms }}
        BUILD_ARGS: ${{ inputs.build-args }}
        KEY: ${{ inputs.key }}
      with:
        script: |
          const { downloadBinary } = require(`${process.env.GITHUB_ACTION_PATH}/../download-binary.js`)
          const binary = await downloadBinary({ exec }, process.env.BINARY_COMMIT)
          await exec.exec(binary, [
            'save',
            '--builder', process.env.BUILDER,
            '--file', process.env.FILE,
            '--target', process.env.TARGET,
            '--platforms', process.env.PLATFORMS,
            '--build-args', process.env.BUILD_ARGS,
            '--key', process.env.KEY,
            '--results-url', process.env.ACTIONS_RESULTS_URL,
          ])
