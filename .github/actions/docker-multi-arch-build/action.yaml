name: 'Docker: Build image'
description: 'Builds a Docker image using Buildx'

inputs:
  repository:
    description: 'The OCI repository to push the image to'
    required: true
    default: ghcr.io/${{ github.repository }}
  tags:
    description: 'The tags to push the image with'
    required: false
    default: |
      type=ref,event=branch
      type=ref,event=pr
      type=semver,pattern={{raw}}
      type=sha
      type=sha,format=long
  flavor:
    description: 'Flavor input forwarded to docker/metadata-action (latest=, prefix=, suffix=)'
    required: false
    default: ''
  context:
    description: 'The build context'
    required: false
    default: '.'
  file:
    description: 'The Dockerfile to use'
    required: false
    default: 'Dockerfile'
  build-args:
    description: 'The build arguments to pass to the Docker build'
    required: false
  target:
    description: 'The build target to use'
    required: false
  push-by-digest:
    description: 'Whether to push the image by digest'
    required: false
    default: 'false'
  push:
    description: 'Whether to push the image'
    required: false
    default: 'true'
  cache-suffix:
    description: 'The suffix to use for the cache key'
    required: false
    default: ''
  github-token:
    description: 'The GitHub token to use for authentication'
    required: false
  dockerhub-username:
    description: 'The Docker Hub username to use for authentication'
    required: false
  dockerhub-token:
    description: 'The Docker Hub token to use for authentication'
    required: false
  build-secrets:
    description: 'Docker build secrets in format KEY=value (multiline)'
    required: false

outputs:
  digest:
    description: 'Digest of the built image'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ inputs.repository }}
        tags: ${{ inputs.tags }}
        flavor: ${{ inputs.flavor }}

    - name: Log into ghcr.io
      if: ${{ inputs.github-token != '' }}
      uses: nick-fields/retry@v4
      env:
        DOCKER_USERNAME: ${{ github.actor }}
        DOCKER_PASSWORD: ${{ inputs.github-token }}
      with:
        timeout_minutes: 2
        max_attempts: 3
        shell: bash
        command: |
          echo "$DOCKER_PASSWORD" | docker login ghcr.io -u "$DOCKER_USERNAME" --password-stdin

    - name: Log into docker.io
      if: ${{ inputs.dockerhub-token != '' }}
      uses: nick-fields/retry@v4
      env:
        DOCKER_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKER_PASSWORD: ${{ inputs.dockerhub-token }}
      with:
        timeout_minutes: 2
        max_attempts: 3
        shell: bash
        command: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

    - name: Set up Docker Buildx
      id: setup-buildx
      uses: docker/setup-buildx-action@v4
      with:
        version: v0.36.1
        driver-opts: image=moby/buildkit:v0.32.2

    - name: Restore Docker cache mounts
      id: cache-mounts
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/buildkit-cache-mounts
        key: buildkit-cache-mounts-${{ runner.arch }}-${{ inputs.repository }}-${{ inputs.cache-suffix }}-${{ github.sha }}
        restore-keys: |
          buildkit-cache-mounts-${{ runner.arch }}-${{ inputs.repository }}-${{ inputs.cache-suffix }}-

    - name: Load Docker cache map
      id: load-cache-map
      uses: actions/github-script@v9
      env:
        CACHE_DIR: ${{ runner.temp }}/buildkit-cache-mounts
      with:
        script: |
          const fs = require('fs')
          const path = require('path')
          const mapPath = path.join(process.env.CACHE_DIR, 'cache-map.json')

          if (!fs.existsSync(mapPath)) {
            core.info(`No Docker cache map found at ${mapPath}; skipping cache injection`)
            core.setOutput('has-cache-mounts', 'false')
            core.setOutput('cache-map', '{}')
            return
          }

          const cacheMap = fs.readFileSync(mapPath, 'utf8').trim()
            .replaceAll('$CACHE_DIR', process.env.CACHE_DIR)
          core.setOutput('has-cache-mounts', cacheMap !== '{}' ? 'true' : 'false')
          core.setOutput('cache-map', cacheMap)

    - name: Inject Docker cache mounts
      if: ${{ steps.load-cache-map.outputs.has-cache-mounts == 'true' }}
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        builder: ${{ steps.setup-buildx.outputs.name }}
        cache-map: ${{ steps.load-cache-map.outputs.cache-map }}
        skip-extraction: true

    - name: Generate registry cache configuration
      id: registry_cache
      uses: actions/github-script@v9
      env:
        CACHE_REPOSITORY: ${{ inputs.repository }}
        CACHE_SUFFIX: ${{ inputs.cache-suffix }}
      with:
        script: |
          const suffix = process.env.CACHE_SUFFIX.trim()
          const key = ['cache', process.env.RUNNER_ARCH, suffix].filter(Boolean).join('-')
          const cache = `type=registry,ref=${process.env.CACHE_REPOSITORY}:${key}`

          core.info(`Using registry cache: ${cache}`)
          core.setOutput('from', cache)
          core.setOutput('to', context.ref === `refs/heads/${context.payload.repository.default_branch}` ? `${cache},mode=max` : '')

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
        BUILDX_METADATA_PROVENANCE: max
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ inputs.push-by-digest == 'false' && steps.meta.outputs.tags || '' }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: ${{ inputs.build-args }}
        target: ${{ inputs.target }}
        provenance: false
        cache-from: ${{ steps.registry_cache.outputs.from }}
        cache-to: ${{ steps.registry_cache.outputs.to }}
        outputs: type=image,"name=${{ inputs.repository }}",push-by-digest=${{ inputs.push-by-digest }},push=${{ inputs.push }}
        secrets: ${{ inputs.build-secrets }}

    - name: Export processed build provenance
      shell: bash
      run: |
        docker buildx history inspect attachment \
          --builder '${{ steps.setup-buildx.outputs.name }}' \
          --type https://slsa.dev/provenance/v1 \
          > '${{ runner.temp }}/build-provenance.json'

    - name: Save Docker cache map
      id: save-cache-map
      uses: actions/github-script@v9
      env:
        CACHE_DIR: ${{ runner.temp }}/buildkit-cache-mounts
      with:
        script: |
          const crypto = require('crypto')
          const fs = require('fs')
          const path = require('path')
          const provenance = JSON.parse(fs.readFileSync(
            path.join(process.env.RUNNER_TEMP, 'build-provenance.json'),
            'utf8'
          ))
          const definitions = provenance.buildDefinition?.internalParameters?.buildConfig?.llbDefinition

          if (!Array.isArray(definitions)) {
            throw new Error('Build provenance does not contain the processed build definition')
          }

          const ids = new Set()
          for (const definition of definitions) {
            const mounts = definition.op?.Op?.exec?.mounts ?? []
            for (const mount of mounts) {
              if (mount.cacheOpt?.ID) {
                ids.add(mount.cacheOpt.ID.replace(/^\/+/, ''))
              }
            }
          }

          const sortedIds = [...ids].sort()
          const cacheMap = {}
          for (const id of sortedIds) {
            const directory = crypto.createHash('sha256').update(id).digest('hex')
            cacheMap[`$CACHE_DIR/mounts/${directory}`] = {
              id,
              target: '/var/cache-target'
            }
          }

          fs.rmSync(process.env.CACHE_DIR, {recursive: true, force: true})
          fs.mkdirSync(process.env.CACHE_DIR, {recursive: true})
          fs.writeFileSync(
            path.join(process.env.CACHE_DIR, 'cache-map.json'),
            `${JSON.stringify(cacheMap, null, 2)}\n`
          )
          core.setOutput('has-cache-mounts', sortedIds.length !== 0 ? 'true' : 'false')
          core.setOutput('cache-map', JSON.stringify(cacheMap).replaceAll('$CACHE_DIR', process.env.CACHE_DIR))

    - name: Register Docker cache mount extraction
      if: ${{ steps.save-cache-map.outputs.has-cache-mounts == 'true' }}
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        builder: ${{ steps.setup-buildx.outputs.name }}
        cache-map: ${{ steps.save-cache-map.outputs.cache-map }}
