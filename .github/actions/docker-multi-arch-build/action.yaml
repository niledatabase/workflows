name: 'Docker: Build image'
description: 'Builds a Docker image using Buildx'

inputs:
  repository:
    description: 'The OCI repository to push the image to'
    required: true
    default: ghcr.io/${{ github.repository }}
  tags:
    description: 'The tags to push the image with'
    required: false
    default: |
      type=ref,event=branch
      type=ref,event=pr
      type=semver,pattern={{raw}}
      type=sha
      type=sha,format=long
  flavor:
    description: 'Flavor input forwarded to docker/metadata-action (latest=, prefix=, suffix=)'
    required: false
    default: ''
  context:
    description: 'The build context'
    required: false
    default: '.'
  file:
    description: 'The Dockerfile to use'
    required: false
    default: 'Dockerfile'
  build-args:
    description: 'The build arguments to pass to the Docker build'
    required: false
  target:
    description: 'The build target to use'
    required: false
  push-by-digest:
    description: 'Whether to push the image by digest'
    required: false
    default: 'false'
  push:
    description: 'Whether to push the image'
    required: false
    default: 'true'
  cache-suffix:
    description: 'The suffix to use for the cache key'
    required: false
    default: ''
  github-token:
    description: 'The GitHub token to use for authentication'
    required: false
  dockerhub-username:
    description: 'The Docker Hub username to use for authentication'
    required: false
  dockerhub-token:
    description: 'The Docker Hub token to use for authentication'
    required: false
  build-secrets:
    description: 'Docker build secrets in format KEY=value (multiline)'
    required: false

outputs:
  digest:
    description: 'Digest of the built image'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ inputs.repository }}
        tags: ${{ inputs.tags }}
        flavor: ${{ inputs.flavor }}

    - name: Log into ghcr.io
      if: ${{ inputs.github-token != '' }}
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ inputs.github-token }}

    - name: Log into docker.io
      if: ${{ inputs.dockerhub-token != '' }}
      uses: docker/login-action@v4
      with:
        username: ${{ inputs.dockerhub-username }}
        password: ${{ inputs.dockerhub-token }}

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Generate cache key
      id: generate_cache_key
      uses: actions/github-script@v9
      with:
        script: |
          const suffix = "${{ inputs.cache-suffix }}"
          const runnerArch = "${{ runner.arch }}".toLowerCase() // x86 / x64 / arm / arm64

          const sanitize = (s) =>
            s.replace(/[^a-zA-Z0-9._-]/g, '-').toLowerCase().slice(0, 64)

          // For PRs, github.ref_name is "<num>/merge"; head_ref is the source branch.
          // For pushes, head_ref is empty.
          const rawBranch = "${{ github.head_ref || github.ref_name }}"
          const branch = sanitize(rawBranch)
          const defaultBranch = sanitize(context.payload.repository.default_branch)

          const base = suffix && suffix.trim().length > 0
            ? `cache-${runnerArch}-${suffix}`
            : `cache-${runnerArch}`

          const cacheKeyBranch = `${base}-${branch}`
          const cacheKeyDefault = `${base}-${defaultBranch}`

          core.info(`Cache key (write):    ${cacheKeyBranch}`)
          core.info(`Cache key (fallback): ${cacheKeyDefault}`)

          core.setOutput("cache_key_branch", cacheKeyBranch)
          core.setOutput("cache_key_default", cacheKeyDefault)

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ inputs.push-by-digest == 'false' && steps.meta.outputs.tags || '' }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: ${{ inputs.build-args }}
        target: ${{ inputs.target }}
        provenance: false
        cache-from: |
          type=registry,ref=${{ inputs.repository }}:${{ steps.generate_cache_key.outputs.cache_key_branch }}
          type=registry,ref=${{ inputs.repository }}:${{ steps.generate_cache_key.outputs.cache_key_default }}
        cache-to: type=registry,ref=${{ inputs.repository }}:${{ steps.generate_cache_key.outputs.cache_key_branch }},mode=max,ignore-error=true
        outputs: type=image,"name=${{ inputs.repository }}",push-by-digest=${{ inputs.push-by-digest }},push=${{ inputs.push }}
        secrets: ${{ inputs.build-secrets }}
