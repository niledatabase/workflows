name: 'Docker: Build image'
description: 'Builds a Docker image using Buildx'

inputs:
  repository:
    description: 'The OCI repository to push the image to'
    required: true
    default: ghcr.io/${{ github.repository }}
  tags:
    description: 'The tags to push the image with'
    required: false
    default: |
      type=ref,event=branch
      type=ref,event=pr
      type=semver,pattern={{raw}}
      type=sha
      type=sha,format=long
  flavor:
    description: 'Flavor input forwarded to docker/metadata-action (latest=, prefix=, suffix=)'
    required: false
    default: ''
  context:
    description: 'The build context'
    required: false
    default: '.'
  file:
    description: 'The Dockerfile to use'
    required: false
    default: 'Dockerfile'
  build-args:
    description: 'The build arguments to pass to the Docker build'
    required: false
  target:
    description: 'The build target to use'
    required: false
  push-by-digest:
    description: 'Whether to push the image by digest'
    required: false
    default: 'false'
  push:
    description: 'Whether to push the image'
    required: false
    default: 'true'
  cache-suffix:
    description: 'The suffix to use for the cache key'
    required: false
    default: ''
  github-token:
    description: 'The GitHub token to use for authentication'
    required: false
  dockerhub-username:
    description: 'The Docker Hub username to use for authentication'
    required: false
  dockerhub-token:
    description: 'The Docker Hub token to use for authentication'
    required: false
  build-secrets:
    description: 'Docker build secrets in format KEY=value (multiline)'
    required: false

outputs:
  digest:
    description: 'Digest of the built image'
    value: ${{ steps.build.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: |
          ${{ inputs.repository }}
        tags: ${{ inputs.tags }}
        flavor: ${{ inputs.flavor }}

    - name: Log into ghcr.io
      if: ${{ inputs.github-token != '' }}
      uses: nick-fields/retry@v4
      env:
        DOCKER_USERNAME: ${{ github.actor }}
        DOCKER_PASSWORD: ${{ inputs.github-token }}
      with:
        timeout_minutes: 2
        max_attempts: 3
        shell: bash
        command: |
          echo "$DOCKER_PASSWORD" | docker login ghcr.io -u "$DOCKER_USERNAME" --password-stdin

    - name: Log into docker.io
      if: ${{ inputs.dockerhub-token != '' }}
      uses: nick-fields/retry@v4
      env:
        DOCKER_USERNAME: ${{ inputs.dockerhub-username }}
        DOCKER_PASSWORD: ${{ inputs.dockerhub-token }}
      with:
        timeout_minutes: 2
        max_attempts: 3
        shell: bash
        command: |
          echo "$DOCKER_PASSWORD" | docker login -u "$DOCKER_USERNAME" --password-stdin

    - name: Set up Docker Buildx
      id: setup-buildx
      uses: docker/setup-buildx-action@v4

    - name: Restore Docker cache mounts
      id: cache-mounts
      uses: actions/cache@v6
      with:
        path: ${{ runner.temp }}/buildkit-cache-mounts
        key: buildkit-cache-mounts-${{ runner.arch }}-${{ inputs.repository }}-${{ inputs.cache-suffix }}-${{ github.sha }}
        restore-keys: |
          buildkit-cache-mounts-${{ runner.arch }}-${{ inputs.repository }}-${{ inputs.cache-suffix }}-

    - name: Inject Docker cache mounts
      uses: reproducible-containers/buildkit-cache-dance@v3
      with:
        builder: ${{ steps.setup-buildx.outputs.name }}
        cache-dir: ${{ runner.temp }}/buildkit-cache-mounts
        dockerfile: ${{ inputs.file }}
        skip-extraction: ${{ steps.cache-mounts.outputs.cache-hit }}

    - name: Generate registry cache configuration
      id: registry_cache
      uses: actions/github-script@v9
      env:
        CACHE_REPOSITORY: ${{ inputs.repository }}
        CACHE_SUFFIX: ${{ inputs.cache-suffix }}
      with:
        script: |
          const suffix = process.env.CACHE_SUFFIX.trim()
          const key = ['cache', process.env.RUNNER_ARCH, suffix].filter(Boolean).join('-')
          const cache = `type=registry,ref=${process.env.CACHE_REPOSITORY}:${key}`

          core.info(`Using registry cache: ${cache}`)
          core.setOutput('from', cache)
          core.setOutput('to', context.ref === `refs/heads/${context.payload.repository.default_branch}` ? `${cache},mode=max` : '')

    - name: Build and push by digest
      id: build
      uses: docker/build-push-action@v7
      env:
        DOCKER_BUILD_RECORD_UPLOAD: false
      with:
        context: ${{ inputs.context }}
        file: ${{ inputs.file }}
        labels: ${{ steps.meta.outputs.labels }}
        tags: ${{ inputs.push-by-digest == 'false' && steps.meta.outputs.tags || '' }}
        annotations: ${{ steps.meta.outputs.annotations }}
        build-args: ${{ inputs.build-args }}
        target: ${{ inputs.target }}
        provenance: false
        cache-from: ${{ steps.registry_cache.outputs.from }}
        cache-to: ${{ steps.registry_cache.outputs.to }}
        outputs: type=image,"name=${{ inputs.repository }}",push-by-digest=${{ inputs.push-by-digest }},push=${{ inputs.push }}
        secrets: ${{ inputs.build-secrets }}
