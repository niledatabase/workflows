name: 'Docker: Publish multi-arch image'
description: 'Merges the digests into a single manifest & pushes it'

inputs:
  repository:
    description: 'The OCI repository to push the image to'
    required: false
    default: ghcr.io/${{ github.repository }}
  tags:
    description: 'The tags to push the image with'
    required: false
    default: |
      type=ref,event=branch
      type=ref,event=pr
      type=semver,pattern={{raw}}
      type=sha
      type=sha,suffix=-{{branch}}-{{commit_date 'X'}},enable={{is_default_branch}}
      type=sha,prefix={{branch}}-sha-,suffix=-ts-{{commit_date 'X'}},enable={{is_default_branch}}
      type=sha,format=long
  flavor:
    description: 'Flavor input forwarded to docker/metadata-action (latest=, prefix=, suffix=)'
    required: false
    default: ''
  attest:
    description: 'Whether to attest the build provenance of the image. Requires the id-token: write and attestations: write permissions'
    required: false
    default: 'false'
  artifact-digest-pattern:
    description: 'The pattern to match the artifact digest files'
    required: false
    default: 'digests-*'
  github-token:
    description: 'The GitHub token to use for authentication'
    required: true

outputs:
  digest:
    description: 'Digest of the built image'
    value: ${{ steps.manifest.outputs.digest }}

runs:
  using: 'composite'
  steps:
    - name: Download digests
      uses: actions/download-artifact@v8
      with:
        path: ${{ runner.temp }}/digests
        pattern: ${{ inputs.artifact-digest-pattern }}
        merge-multiple: true

    - name: Log into registry ghcr.io
      uses: nick-fields/retry@v4
      env:
        DOCKER_USERNAME: ${{ github.actor }}
        DOCKER_PASSWORD: ${{ inputs.github-token }}
      with:
        timeout_minutes: 2
        max_attempts: 3
        shell: bash
        command: |
          echo "$DOCKER_PASSWORD" | docker login ghcr.io -u "$DOCKER_USERNAME" --password-stdin

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Docker meta
      id: meta
      uses: docker/metadata-action@v6
      env:
        DOCKER_METADATA_ANNOTATIONS_LEVELS: index
      with:
        images: |
          ${{ inputs.repository }}
        tags: ${{ inputs.tags }}
        flavor: ${{ inputs.flavor }}
        annotations: |
          dev.thenile.commit.author=${{ github.event.head_commit.author.name }}
          dev.thenile.build.url=${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}

    - name: Create manifest list and push
      id: manifest
      uses: actions/github-script@v9
      env:
        REPOSITORY: ${{ inputs.repository }}
      with:
        script: |
          const fs = require('node:fs')
          const path = require('node:path')
          const { setTimeout: sleep } = require('node:timers/promises')

          const repository = process.env.REPOSITORY
          const metadata = JSON.parse(process.env.DOCKER_METADATA_OUTPUT_JSON)
          const resultFile = path.join(process.env.RUNNER_TEMP, 'imagetools-create-result.json')
          const args = [
            'buildx', 'imagetools', 'create', '--metadata-file', resultFile,
            ...metadata.tags.flatMap(tag => ['--tag', tag]),
            // Annotations without a value are skipped.
            ...metadata.annotations.filter(annotation => /=./.test(annotation)).flatMap(annotation => ['--annotation', annotation]),
            ...fs.readdirSync(path.join(process.env.RUNNER_TEMP, 'digests')).map(digest => `${repository}@sha256:${digest}`),
          ]

          for (let attempt = 1; ; attempt++) {
            try {
              await exec.exec('docker', args)
              break
            } catch (error) {
              if (attempt === 3) throw error
              core.warning(`Attempt ${attempt} failed: ${error.message}`)
              await sleep(10_000)
            }
          }

          const digest = JSON.parse(fs.readFileSync(resultFile, 'utf8'))['containerimage.descriptor'].digest
          await exec.exec('docker', ['buildx', 'imagetools', 'inspect', `${repository}@${digest}`])
          core.setOutput('digest', digest)

    - name: Attest build provenance
      if: ${{ inputs.attest == 'true' }}
      uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
      with:
        subject-name: ${{ inputs.repository }}
        subject-digest: ${{ steps.manifest.outputs.digest }}
        push-to-registry: true
        create-storage-record: false
