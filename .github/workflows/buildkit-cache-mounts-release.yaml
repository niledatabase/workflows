name: BuildKit cache mounts release

on:
  pull_request:
    paths:
      - '.github/actions/buildkit-cache-mounts/**'
      - '.github/workflows/buildkit-cache-mounts-release.yaml'
  push:
    branches:
      - main
    paths:
      - '.github/actions/buildkit-cache-mounts/**'
      - '.github/workflows/buildkit-cache-mounts-release.yaml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    outputs:
      binary-commit: ${{ steps.binary-commit.outputs.binary-commit }}
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - name: Check binary-commit defaults
        id: binary-commit
        working-directory: .github/actions/buildkit-cache-mounts
        run: |
          restore="$(yq '.inputs.binary-commit.default' restore/action.yaml)"
          save="$(yq '.inputs.binary-commit.default' save/action.yaml)"
          if [[ "$restore" != "$save" ]]; then
            echo "::error::The binary-commit defaults differ: restore has '$restore', save has '$save'."
            exit 1
          fi
          echo "binary-commit=$restore" >> "$GITHUB_OUTPUT"
      - uses: actions/setup-go@v6
        with:
          go-version-file: .github/actions/buildkit-cache-mounts/go.mod
          cache-dependency-path: .github/actions/buildkit-cache-mounts/go.sum
      - name: Restore and save golangci-lint cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.github/actions/buildkit-cache-mounts/.golangci.yaml', '.github/actions/buildkit-cache-mounts/go.sum') }}
          restore-keys: golangci-lint-${{ runner.os }}-
      - name: Lint
        working-directory: .github/actions/buildkit-cache-mounts
        run: make lint
      - name: Test
        working-directory: .github/actions/buildkit-cache-mounts
        run: make test integration

  release:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
    # Any step in this job can sign provenance, so the actions are pinned by commit SHA.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@924ae3a1cded613372ab5595356fb5720e22ba16 # v6.5.0
        with:
          go-version-file: .github/actions/buildkit-cache-mounts/go.mod
          # The verify job runs test code before it saves the Go module and build caches, and Go does not verify cached files.
          cache: false
      - name: Build
        working-directory: .github/actions/buildkit-cache-mounts
        run: make build
      - name: Compare with the pinned release
        id: compare
        working-directory: .github/actions/buildkit-cache-mounts/bin
        env:
          BINARY_COMMIT: ${{ needs.verify.outputs.binary-commit }}
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          changed=false
          pinned_dir="$RUNNER_TEMP/pinned"
          if [[ -z "$BINARY_COMMIT" ]] ||
            ! gh release download "buildkit-cache-mounts-$BINARY_COMMIT" \
              --repo "$GITHUB_REPOSITORY" \
              --pattern 'buildkit-cache-mounts-linux-*' \
              --dir "$pinned_dir" ||
            ! diff --brief --recursive . "$pinned_dir"; then
            changed=true
          fi
          echo "changed=$changed" >> "$GITHUB_OUTPUT"
      - name: Attest binaries
        if: steps.compare.outputs.changed == 'true'
        uses: actions/attest-build-provenance@977bb373ede98d70efdf65b84cb5f73e068dcc2a # v3.0.0
        with:
          subject-path: .github/actions/buildkit-cache-mounts/bin/*
      - name: Publish release
        if: steps.compare.outputs.changed == 'true'
        working-directory: .github/actions/buildkit-cache-mounts
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          gh release create "buildkit-cache-mounts-$GITHUB_SHA" bin/* \
            --latest=false \
            --target "$GITHUB_SHA" \
            --title "BuildKit cache mounts ${GITHUB_SHA::12}" \
            --notes "Built from $GITHUB_SHA."
