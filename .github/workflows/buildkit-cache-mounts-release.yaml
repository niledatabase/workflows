name: BuildKit cache mounts release

on:
  pull_request:
    paths:
      - '.github/actions/buildkit-cache-mounts/**'
      - '.github/workflows/buildkit-cache-mounts-release.yaml'
  push:
    branches:
      - main
    paths:
      - '.github/actions/buildkit-cache-mounts/**'
      - '.github/workflows/buildkit-cache-mounts-release.yaml'

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-go@v7
        with:
          go-version-file: .github/actions/buildkit-cache-mounts/go.mod
          cache-dependency-path: .github/actions/buildkit-cache-mounts/go.sum
      - name: Restore and save golangci-lint cache
        uses: actions/cache@v6
        with:
          path: ~/.cache/golangci-lint
          key: golangci-lint-${{ runner.os }}-${{ hashFiles('.github/actions/buildkit-cache-mounts/.golangci.yaml', '.github/actions/buildkit-cache-mounts/go.sum') }}
          restore-keys: golangci-lint-${{ runner.os }}-
      - name: Lint
        working-directory: .github/actions/buildkit-cache-mounts
        run: make lint
      - name: Test
        working-directory: .github/actions/buildkit-cache-mounts
        run: make test integration

  release:
    if: github.event_name == 'push'
    needs: verify
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
      id-token: write
      attestations: write
    env:
      IMAGE: ghcr.io/${{ github.repository_owner }}/buildkit-cache-mounts
    # Any step in this job can sign provenance, so the actions are pinned by commit SHA.
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version-file: .github/actions/buildkit-cache-mounts/go.mod
          # The verify job runs test code before it saves the Go module and build caches, and Go does not verify cached files.
          cache: false
      - name: Build binaries
        working-directory: .github/actions/buildkit-cache-mounts
        run: make build
      - name: Build and push image
        id: image
        working-directory: .github/actions/buildkit-cache-mounts
        env:
          REGISTRY_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          # With rewrite-timestamp, the image digest does not depend on the build time.
          SOURCE_DATE_EPOCH: 0
        run: |
          echo "$REGISTRY_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          docker buildx create --use --driver docker-container \
            --driver-opt image=docker.io/moby/buildkit:v0.34.1@sha256:99368f3e46177c6405b9740e4461d91cee004128daeecca78d4ceac50ec1da5c
          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --provenance=false \
            --file Dockerfile \
            --metadata-file "$RUNNER_TEMP/image-metadata.json" \
            --output "type=image,name=$IMAGE:$GITHUB_SHA,push=true,rewrite-timestamp=true" \
            bin
          echo "digest=$(jq --raw-output '."containerimage.digest"' "$RUNNER_TEMP/image-metadata.json")" >> "$GITHUB_OUTPUT"
      - name: Attest image
        uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        with:
          subject-name: ${{ env.IMAGE }}
          subject-digest: ${{ steps.image.outputs.digest }}
          push-to-registry: true
