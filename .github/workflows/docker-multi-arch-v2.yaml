name: Build multi-arch images

on:
  workflow_call:
    inputs:
      file:
        required: false
        default: Dockerfile
        type: string
      repository:
        required: false
        type: string
        default: ghcr.io/${{ github.repository }}
      context:
        required: false
        type: string
        default: "."
      tags:
        required: false
        type: string
        default: |
          type=ref,event=branch
          type=ref,event=pr
          type=semver,pattern={{raw}}
          type=sha
          type=sha,suffix=-{{branch}}-{{commit_date 'X'}},enable={{is_default_branch}}
          type=sha,prefix={{branch}}-sha-,suffix=-ts-{{commit_date 'X'}},enable={{is_default_branch}}
          type=sha,format=long
      flavor:
        required: false
        type: string
        default: ''
      build-args:
        required: false
        type: string
      target:
        required: false
        type: string
      runners:
        required: false
        type: string
        default: '["public-ubuntu-arm64-2-core","public-ubuntu-x64-2-core"]'
      cache-suffix:
        required: false
        type: string
        default: ''
      dockerhub-username:
        type: string
        required: false
      dockerhub-token:
        type: string
        required: false
    secrets:
      build-secrets:
        required: false

    outputs:
      digest:
        description: "Digest of the built image"
        value: ${{ jobs.merge.outputs.digest }}

jobs:
  setup:
    runs-on: public-ubuntu-x64-2-core
    outputs:
      uuid: ${{ steps.uuid.outputs.uuid }}
    steps:
      - name: Generate UUID for a unique artifact prefix within workflow
        id: uuid
        run: echo "uuid=$(uuidgen)" >> $GITHUB_OUTPUT

  build:
    needs: [ setup ]
    strategy:
      fail-fast: false
      matrix:
        runner: ${{ fromJSON(inputs.runners) }}
    runs-on: ${{ matrix.runner }}
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6
      - name: Build image
        id: build
        uses: niledatabase/workflows/.github/actions/docker-multi-arch-build@per-branch-docker-cache
        with:
          repository: ${{ inputs.repository }}
          tags: ${{ inputs.tags }}
          flavor: ${{ inputs.flavor }}
          context: ${{ inputs.context }}
          file: ${{ inputs.file }}
          build-args: ${{ inputs.build-args }}
          target: ${{ inputs.target }}
          push-by-digest: true
          cache-suffix: ${{ inputs.cache-suffix }}
          github-token: ${{ secrets.GITHUB_TOKEN }}
          dockerhub-username: ${{ inputs.dockerhub-username }}
          dockerhub-token: ${{ inputs.dockerhub-token }}
          build-secrets: ${{ secrets.build-secrets }}

      - name: Export digest
        run: |
          mkdir -p ${{ runner.temp }}/digests
          digest="${{ steps.build.outputs.digest }}"
          touch "${{ runner.temp }}/digests/${digest#sha256:}"

      - name: Upload digest
        uses: actions/upload-artifact@v7
        with:
          name: digests-${{ needs.setup.outputs.uuid }}-${{ runner.arch }}
          path: ${{ runner.temp }}/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    runs-on: public-ubuntu-x64-2-core
    outputs:
      digest: ${{ steps.push-multi-arch.outputs.digest }}
    needs:
      - setup
      - build
    steps:
      - name: Push multi-arch
        id: push-multi-arch
        uses: niledatabase/workflows/.github/actions/docker-multi-arch-push@per-branch-docker-cache
        with:
          repository: ${{ inputs.repository }}
          tags: ${{ inputs.tags }}
          flavor: ${{ inputs.flavor }}
          artifact-digest-pattern: digests-${{ needs.setup.outputs.uuid }}-*
          github-token: ${{ secrets.GITHUB_TOKEN }}

  cleanup-cache:
    needs: [merge]
    if: ${{ !cancelled() && needs.merge.result == 'success' }}
    runs-on: public-ubuntu-x64-2-core
    permissions:
      contents: read
      packages: write
    steps:
      - name: Resolve package name and exclude list
        id: resolve
        uses: actions/github-script@v9
        with:
          script: |
            // inputs.repository is e.g. "ghcr.io/niledatabase/operator" or
            // "ghcr.io/niledatabase/nile-proxy/nile_proxy". Strip "ghcr.io/<owner>/"
            // and use the remainder verbatim as the package name (GHCR allows "/").
            const repository = `${{ inputs.repository }}`
            const m = repository.match(/^ghcr\.io\/[^/]+\/(.+)$/)
            if (!m) {
              core.setFailed(`cannot parse package name from repository: ${repository}`)
              return
            }
            const pkg = m[1]
            core.info(`Package: ${pkg}`)

            const branches = await github.paginate(
              github.rest.repos.listBranches,
              { ...context.repo, per_page: 100 },
              (response) => response.data.map((b) => b.name)
            )
            if (branches.length === 0) {
              core.setFailed('listBranches returned no branches; aborting to avoid mass deletion')
              return
            }

            const sanitize = (s) =>
              s.replace(/[^a-zA-Z0-9._-]/g, '-').toLowerCase().slice(0, 64)
            const archs = ['x64', 'arm64']
            // Wildcard prefix so suffixed variants (e.g. cache-x64-pg15-<branch>) are also preserved.
            const exclude = branches.flatMap((b) => {
              const s = sanitize(b)
              return archs.map((a) => `cache-${a}-*${s}`)
            })

            core.setOutput('package', pkg)
            core.setOutput('exclude_tags', exclude.join(','))

      - name: Prune stale cache tags
        uses: dataaxiom/ghcr-cleanup-action@v1
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          package: ${{ steps.resolve.outputs.package }}
          delete-tags: cache-x64-*,cache-arm64-*
          exclude-tags: ${{ steps.resolve.outputs.exclude_tags }}
          older-than: 1 day
